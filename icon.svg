<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f7a55"/>
      <stop offset="0.65" stop-color="#0e3d2c"/>
      <stop offset="1" stop-color="#08221a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#f2c45a"/>
      <stop offset="1" stop-color="#c98a22"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b2c35"/>
      <stop offset="1" stop-color="#5e141d"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a0f17"/>
      <stop offset="1" stop-color="#7a1c26"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e6dcc4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#f2c45a" stroke-opacity="0.12" stroke-width="3"/>

  <g transform="rotate(-8 256 270)" filter="url(#shadow)">
    <!-- cards peeking out of the book like bookmarks -->
    <g filter="url(#soft)">
      <g transform="rotate(-14 205 150)">
        <rect x="160" y="88" width="92" height="128" rx="10" fill="url(#card)"/>
        <text x="174" y="122" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#1b1f24">A</text>
        <text x="172" y="150" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#1b1f24">♠</text>
      </g>
      <g transform="rotate(10 300 150)">
        <rect x="262" y="84" width="92" height="128" rx="10" fill="url(#card)"/>
        <text x="276" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#e5384b">K</text>
        <text x="275" y="146" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#e5384b">♥</text>
      </g>
    </g>

    <!-- pages block -->
    <rect x="142" y="150" width="242" height="268" rx="10" fill="url(#pages)"/>
    <g stroke="#d6c9a8" stroke-width="2">
      <line x1="384" y1="168" x2="384" y2="400"/>
      <line x1="378" y1="168" x2="378" y2="400"/>
    </g>
    <!-- cover -->
    <rect x="120" y="140" width="252" height="272" rx="14" fill="url(#cover)"/>
    <rect x="120" y="140" width="34" height="272" rx="12" fill="url(#spine)"/>
    <line x1="154" y1="146" x2="154" y2="406" stroke="#3a0a10" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="170" y="160" width="184" height="232" rx="8" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="179" y="169" width="166" height="214" rx="5" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="120" y="186" width="34" height="6" fill="url(#gold)"/>
    <rect x="120" y="360" width="34" height="6" fill="url(#gold)"/>

    <!-- emblem: spade inside a poker chip -->
    <circle cx="262" cy="258" r="56" fill="#4a0f17" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="262" cy="258" r="46" fill="none" stroke="url(#gold)" stroke-width="7" stroke-dasharray="12 12"/>
    <path fill="url(#gold)" d="M262 222c-6 14-36 30-36 50 0 12 9 20 20 20 7 0 11-3 13-6-1 9-5 15-11 19h28c-6-4-10-10-11-19 2 3 6 6 13 6 11 0 20-8 20-20 0-20-30-36-36-50z"/>

    <!-- title lines -->
    <rect x="212" y="336" width="100" height="9" rx="4.5" fill="url(#gold)"/>
    <rect x="228" y="354" width="68" height="6" rx="3" fill="url(#gold)" fill-opacity="0.6"/>

    <!-- ribbon bookmark -->
    <path d="M318 408 v42 l12 -10 l12 10 v-42z" fill="#f2c45a"/>
  </g>
</svg>
